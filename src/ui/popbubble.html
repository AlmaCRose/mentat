<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'">
  <title>Mentat</title>
  <link rel="stylesheet" href="themes.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: "Segoe UI", system-ui, sans-serif; }
    #bubble {
      position: absolute; left: 12px; top: 4px; width: 56px; height: 56px; border-radius: 50%;
      background: var(--bg-3); border: 2px solid var(--accent-2); box-sizing: border-box;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .55);
      transition: transform .12s ease, border-color .2s ease;
    }
    #bubble:hover { transform: scale(1.06); }
    #bubble svg { width: 26px; height: 26px; fill: var(--text); pointer-events: none; }
    /* Window showing: filled with the accent colour (click hides it). */
    #bubble.showing { background: var(--accent-2); border-color: var(--accent); }
    #bubble.showing svg { fill: var(--on-accent); }
    #bubble.bad { border-color: var(--red); animation: pulse 1.6s ease-in-out infinite; }
    /* The live badge: a pill across the bottom of the circle. */
    #badge {
      position: absolute; left: 50%; top: 50px; transform: translateX(-50%); max-width: 78px; min-width: 30px; height: 22px; padding: 0 7px; box-sizing: border-box;
      border-radius: 11px; background: var(--bg-2); color: var(--text); border: 1.5px solid var(--line);
      font-size: 12px; font-weight: 700; line-height: 19px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-variant-numeric: tabular-nums; pointer-events: none; box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
    }
    #badge[hidden] { display: none; }
    #badge.ok { border-color: var(--green); color: var(--pos); }
    #badge.warn { border-color: var(--orange); color: color-mix(in srgb, var(--orange) 75%, var(--text)); }
    #badge.bad { border-color: var(--red); background: var(--red); color: #fff; }
    #badge.info { border-color: var(--blue); }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 3px 10px rgba(0, 0, 0, .55), 0 0 0 0 rgba(229, 83, 75, .55); }
      50% { box-shadow: 0 3px 10px rgba(0, 0, 0, .55), 0 0 0 7px rgba(229, 83, 75, 0); }
    }
    @media (prefers-reduced-motion: reduce) { #bubble.bad { animation: none; } }
  </style>
</head>
<body>
  <div id="bubble" role="button"><svg viewBox="0 0 24 24" aria-hidden="true"></svg></div>
  <div id="badge" hidden></div>
  <script src="icons.js"></script>
  <script src="popbubble-ui.js"></script>
</body>
</html>

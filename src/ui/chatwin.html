<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
  <title>Torn Chat</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="chat-bar">
  <header id="chatbar">
    <button id="cb-pin" class="icon-btn" title="Keep this window on top of other windows">&#128204;</button>
    <div id="cb-emojis" title="Click in Torn's chat box, then click an emoji to type it"></div>
    <button id="cb-more" class="icon-btn" title="All emojis (Windows emoji panel, also Win + .)">&#128512;&#xFE0E;+</button>
    <button id="cb-reload" class="icon-btn" title="Reload (F5)">&#8635;</button>
    <button id="cb-tool" title="Show the Mentat tools (Ctrl+D)">Tools</button>
    <button id="cb-collapse" class="icon-btn" title="Collapse to a bubble (Ctrl+K)">&#9472;</button>
  </header>
  <script src="chatwin-ui.js"></script>
</body>
</html>
